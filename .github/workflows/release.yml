name: Publish standalone release
# Tagging vX.Y.Z (without -alpha) publishes the official unsigned release assets.
# Never tag an unreviewed commit. Binaries are not code-signed.
# Never overwrite an existing release (including v2.3.0–v2.6.0). Ship fixes under a new tag.
# Release body MUST come from docs/releases/vX.Y.Z.md (version-specific), not the notes index.
# See docs/RELEASE-CHECKLIST.md and docs/GOVERNANCE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version to publish, e.g. v2.6.0 (must match model.go Version; leave empty only when unused)'
        type: string
        default: ''
        required: true
permissions:
  contents: read
jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Tag push: github.ref is refs/tags/vX.Y.Z (commit = tagged SHA).
      # workflow_dispatch: require inputs.tag to already exist and check it out so
      # the built tree cannot silently diverge from the named release tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/php2shell doctor
      - name: Release documentation consistency
        shell: bash
        run: bash scripts/check-release-docs.sh
  publish:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build portable executables
        run: bash scripts/build-release.sh
      - name: Inspect assets
        run: |
          set -euo pipefail
          ./dist/php2shell-linux-amd64 version
          file dist/php2shell-* | head -20
          (cd dist && sha256sum --check --status SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "Refusing to publish: empty tag (set workflow_dispatch input or push a vX.Y.Z tag)" >&2
            exit 1
          fi
          # Bind release to the checked-out commit (not the dispatch branch tip).
          TARGET_SHA="$(git rev-parse HEAD)"
          echo "Release target SHA: ${TARGET_SHA}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$TARGET_SHA" != "$tag_sha" ]]; then
              echo "Refusing to publish: checked-out HEAD $TARGET_SHA != tag $TAG at $tag_sha" >&2
              exit 1
            fi
          fi
          built="$(./dist/php2shell-linux-amd64 version | awk '{print $2}')"
          if [[ "$TAG" != "v${built}" ]]; then
            echo "Refusing to publish: tag $TAG does not match built version v${built}" >&2
            exit 1
          fi
          if [[ "$TAG" == *-alpha.* || "$TAG" == *-beta.* || "$TAG" == *-rc.* ]]; then
            echo "Refusing to publish prerelease tag $TAG via the official release workflow" >&2
            exit 1
          fi
          bash scripts/check-release-docs.sh --for-tag "$TAG"
          NOTES="docs/releases/${TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Refusing to publish: missing version-specific notes $NOTES" >&2
            exit 1
          fi
          if grep -Eiq 'unreleased draft|do not tag or publish until' "$NOTES"; then
            echo "Refusing to publish: $NOTES still contains draft/unreleased language" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; do not silently overwrite assets" >&2
            exit 1
          fi
          gh release create "$TAG" dist/php2shell-* dist/SHA256SUMS \
            --target "${TARGET_SHA}" \
            --title "PHP2Shell $TAG" \
            --notes-file "$NOTES"
