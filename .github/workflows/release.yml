name: Publish standalone release
# Tagging vX.Y.Z (without -alpha) publishes the official unsigned release assets.
# Never tag an unreviewed commit. Binaries are not code-signed.
# Never overwrite an existing release (including v2.3.0 / v2.3.1 / v2.4.0). Ship fixes under a new tag.
# See docs/RELEASE-CHECKLIST.md and docs/GOVERNANCE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version to publish, e.g. v2.4.0'
        type: string
        default: v2.4.0
        required: true
permissions:
  contents: read
jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/php2shell doctor
  publish:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build portable executables
        run: bash scripts/build-release.sh
      - name: Inspect assets
        run: |
          set -euo pipefail
          ./dist/php2shell-linux-amd64 version
          file dist/php2shell-* | head -20
          (cd dist && sha256sum --check --status SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          built="$(./dist/php2shell-linux-amd64 version | awk '{print $2}')"
          if [[ "$TAG" != "v${built}" ]]; then
            echo "Refusing to publish: tag $TAG does not match built version v${built}" >&2
            exit 1
          fi
          if [[ "$TAG" == *-alpha.* || "$TAG" == *-beta.* || "$TAG" == *-rc.* ]]; then
            echo "Refusing to publish prerelease tag $TAG via the official release workflow" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; do not silently overwrite assets" >&2
            exit 1
          fi
          gh release create "$TAG" dist/php2shell-* dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "PHP2Shell $TAG" \
            --notes-file docs/RELEASE-NOTES.md
