name: Publish standalone ALPHA downloads
# Historical / optional prerelease path for v*-alpha.* tags only.
# Prefer docs/RELEASE-NOTES.md and the official release.yml for customer-facing builds.
# Never tag an unreviewed commit. All alpha assets are for testing only; keep --prerelease.
on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Alpha version to publish, e.g. v2.2.0-alpha.2'
        type: string
        default: v2.2.0-alpha.1
        required: true
permissions:
  contents: read
jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/php2shell doctor
  publish:
    name: Build and publish alpha prerelease
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build portable executable variants (incl. Windows legacy)
        run: bash scripts/build-release.sh
      - name: Inspect assets
        run: |
          set -euo pipefail
          ./dist/php2shell-linux-amd64 version
          file dist/php2shell-* | head -20
          (cd dist && sha256sum --check --status SHA256SUMS)
      - name: Publish GitHub Release as prerelease (NOT production-approved)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          built="$(./dist/php2shell-linux-amd64 version | awk '{print $2}')"
          if [[ "$TAG" != "v${built}" || "$TAG" != *-alpha.* ]]; then
            echo "Refusing to publish: tag $TAG does not match built alpha version v${built}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; do not silently overwrite assets" >&2
            exit 1
          fi
          gh release create "$TAG" dist/php2shell-* dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --prerelease \
            --title "PHP2Shell $TAG – unsigned development preview" \
            --notes-file docs/ALPHA-RELEASE-NOTES.md
