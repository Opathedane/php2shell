name: Build standalone preview (manual, no release)
# Maintainer convenience artifacts only — not a GitHub Release and not production-approved.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Cross-compile native builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MODULE="github.com/Opathedane/php2shell/internal/audit"
          for platform in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            filename="php2shell-${os}-${arch}"
            if [ "${os}" = windows ]; then filename="${filename}.exe"; fi
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X ${MODULE}.BuildFlavor=standard" \
              -o "dist/${filename}" ./cmd/php2shell
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null
          bash scripts/build-windows-legacy.sh
          (cd dist && sha256sum php2shell-* > SHA256SUMS)
      - name: Upload preview artifact – unsigned and not production approved
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php2shell-native-unsigned-preview
          path: dist/
          if-no-files-found: error
