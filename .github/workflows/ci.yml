name: Go tests (Linux, Windows, macOS)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Unit and integration fixture tests
        run: go test ./...
      - name: Static check
        run: go vet ./...
      - name: Native build smoke
        run: go run ./cmd/php2shell doctor
      - name: IIS W3C log smoke (portable fixture)
        shell: bash
        run: |
          echo '#Fields: date time cs-method cs-uri-stem cs-uri-query sc-status' > iis-fixture.log
          echo '2026-10-21 12:00:00 POST /upload.php - 200' >> iis-fixture.log
          go run ./cmd/php2shell scan --access-log iis-fixture.log --out reports/ci-smoke
          test -s reports/ci-smoke.json
