# Synthetic Windows Apache HTTP Server layout (non-C: DocumentRoot + php-cgi Action).
ServerRoot "C:/Apache24"
Listen 80
LoadModule php_module "C:/PHP/8.4.24/php8apache2_4.dll"
<VirtualHost *:80>
    ServerName win-app.example.local
    DocumentRoot "E:/websites/prod/apache-app"
    Action application/x-httpd-php "E:/PHP/8.4.24/php-cgi.exe"
    AddHandler application/x-httpd-php .php
</VirtualHost>
