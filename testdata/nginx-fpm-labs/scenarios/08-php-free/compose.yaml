services:
  scan:
    image: debian:bookworm-slim
    volumes:
      - ./nginx:/etc/nginx:ro

      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../results/08-php-free:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /results
        php2shell scan --hostname lab-08-php-free --output-dir /results --quiet || true
        ls -la /results
        test -n "$(ls /results/*.html 2>/dev/null)"
