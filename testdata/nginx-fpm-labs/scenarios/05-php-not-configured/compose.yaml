# Real php CLI image supplies ordinary /usr/local/bin/php — not a planted decoy.
# nginx has no PHP FastCGI handler.
services:
  scan:
    hostname: lab-05-php-not-configured
    image: php:8.3-cli-bookworm
    user: "65534:65534"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./fpm:/usr/local/etc/php-fpm.d:ro
      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../scripts/scan-inside.sh:/usr/local/bin/scan-inside.sh:ro
      - ../../results/05-php-not-configured:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "/usr/local/bin/scan-inside.sh"]
    command: ["lab-05-php-not-configured"]
