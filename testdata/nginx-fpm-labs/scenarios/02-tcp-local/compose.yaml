services:
  fpm:
    image: php:8.3-fpm-bookworm
    profiles: ["with-runtime"]
    volumes:
      - ./fpm/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
    entrypoint: ["/bin/sh", "-c", "exec docker-php-entrypoint php-fpm -F"]

  scan:
    hostname: lab-02-tcp-local
    image: debian:bookworm-slim
    user: "65534:65534"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./fpm:/usr/local/etc/php-fpm.d:ro
      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../scripts/scan-inside.sh:/usr/local/bin/scan-inside.sh:ro
      - ../../results/02-tcp-local:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "/usr/local/bin/scan-inside.sh"]
    command: ["lab-02-tcp-local"]
