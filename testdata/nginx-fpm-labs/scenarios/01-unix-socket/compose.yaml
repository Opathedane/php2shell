# Config-discovery live lab. Optional fpm/nginx services prove packages exist; scan FS uses ordinary well-known mounts only.
services:
  fpm:
    image: php:8.3-fpm-bookworm
    profiles: ["with-runtime"]
    volumes:
      - ./fpm/www.conf:/usr/local/etc/php-fpm.d/zz-www.conf:ro
      - sockdata:/run/php
    entrypoint: ["/bin/sh", "-c", "mkdir -p /run/php && exec docker-php-entrypoint php-fpm -F"]

  nginx:
    image: nginx:1.27-bookworm
    profiles: ["with-runtime"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - sockdata:/run/php
    depends_on: [fpm]

  scan:
    image: debian:bookworm-slim
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./fpm:/usr/local/etc/php-fpm.d:ro
      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../results/01-unix-socket:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /results
        php2shell scan --hostname lab-01-unix-socket --output-dir /results --quiet || true
        ls -la /results
        test -n "$(ls /results/*.html 2>/dev/null)"

volumes:
  sockdata:
