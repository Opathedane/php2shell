# FPM service is never started by the harness for this scenario (see run-all.sh ground-truth-runtime.json).
services:
  scan:
    image: debian:bookworm-slim
    user: "65534:65534"
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./fpm:/usr/local/etc/php-fpm.d:ro
      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../scripts/scan-inside.sh:/usr/local/bin/scan-inside.sh:ro
      - ../../results/06-fpm-stopped:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "/usr/local/bin/scan-inside.sh"]
    command: ["lab-06-fpm-stopped"]
