services:
  prepare:
    image: debian:bookworm-slim
    user: "0:0"
    volumes:
      - ./fpm:/fpm
    entrypoint: ["/bin/sh", "-c"]
    command: ["chmod 000 /fpm/secret.conf && ls -la /fpm"]

  scan:
    hostname: lab-07-unreadable-config
    image: debian:bookworm-slim
    user: "65534:65534"
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - ./nginx:/etc/nginx:ro
      - ./fpm:/usr/local/etc/php-fpm.d:ro
      - ../../bin/php2shell-linux-amd64:/usr/local/bin/php2shell:ro
      - ../../scripts/scan-inside.sh:/usr/local/bin/scan-inside.sh:ro
      - ../../results/07-unreadable-config:/results
    working_dir: /results
    entrypoint: ["/bin/sh", "/usr/local/bin/scan-inside.sh"]
    command: ["lab-07-unreadable-config"]
